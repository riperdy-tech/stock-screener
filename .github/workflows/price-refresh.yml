# Post-close price refresh — live yfinance closes for the whole universe,
# then a full re-score so quant bands, the LLM MoS gate, the ledgers and the
# site chart all see TODAY's actual closing prices before the local RS2
# orchestrator reviews them (08:00 Taipei = 00:00 UTC).
#
# 21:05 UTC = after the US close year-round (17:05 EDT / 16:05 EST). GitHub
# crons drift 0-3h; the RS2 task at 00:00 UTC leaves ~3h of headroom. If a run
# slips past RS2 anyway, RS2 simply reviews the post-open bands from 14:35 —
# graceful degradation, not failure.
#
# No fundamentals here: statements/dividends/earnings haven't changed since the
# post-open fetch. Prices only, then the scoring chain.
#
# KIS note: this workflow is intentionally NOT in kis-sync's workflow_run
# chain (that chains on "Scheduled Data Fetch" only) — the market is closed
# when this runs, so a sync could only no-op.

name: Post-Close Price Refresh

on:
  schedule:
    - cron: '5 21 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch + report coverage only; write and commit nothing"
        type: boolean
        default: false

permissions:
  contents: write

# Same writer group as the data fetch + weekly analyst: all three regenerate
# public/data files, and concurrent pushes caused silent rebase losses before.
concurrency:
  group: data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (latest main)
        uses: actions/checkout@v4
        with:
          ref: main

      # Depth overlay freshness watchdog, folded in from the standalone
      # overlay-freshness-watchdog.yml to save scheduled-workflow minutes.
      # Placed before the heavy steps and marked continue-on-error so a dead
      # depth producer still alerts even if the refresh itself aborts.
      # Cloud-side on purpose: a dead machine cannot alert about itself.
      # Silent no-op when the Telegram secrets are absent.
      - name: Overlay freshness watchdog
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.KIS_TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.KIS_TG_CHAT_ID }}
        run: |
          AGE_H=$(python3 - <<'EOF'
          import json, datetime
          # depth_overlay.json stamps generated_at with datetime.now().isoformat() —
          # NAIVE local time, no 'Z'. Parse it naive and compare against a naive now()
          # (handoff §8); the old ts.replace("Z","+00:00") + now(tz=utc) path raises
          # on a naive/aware mix.
          ts = json.load(open("public/data/depth_overlay.json"))["generated_at"]
          dt = datetime.datetime.fromisoformat(ts)
          print(round((datetime.datetime.now() - dt).total_seconds() / 3600))
          EOF
          )
          echo "overlay age: ${AGE_H}h"
          # The depth producer refreshes continuously; 36h still fires only when the
          # producer/PC/push has genuinely been down across more than a day.
          if [ "$AGE_H" -gt 36 ]; then
            echo "::warning::depth_overlay.json is ${AGE_H}h old (>36h)"
            if [ -n "$TG_TOKEN" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"                 -d chat_id="${TG_CHAT}"                 -d text="[RS2 ops] depth_overlay.json is ${AGE_H}h old (>36h) - depth producer/PC/push may be down." >/dev/null
              echo "telegram alert sent"
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance==1.5.1 pandas numpy requests finance-datareader supabase python-dotenv lxml html5lib beautifulsoup4 openai duckdb

      - name: Live price overlay
        id: overlay
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/refresh_prices.py --dry-run
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python scripts/refresh_prices.py; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            # exit 3 = coverage below threshold: snapshot preserved, nothing new
            # to score. Skip the chain rather than re-scoring identical data.
            echo "::warning::overlay aborted (coverage/rate limits) — no re-score"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-score on closing prices
        if: steps.overlay.outputs.skipped == 'false'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/build_price_history.py
          python scripts/run_chain.py

      - name: Commit and Push
        if: steps.overlay.outputs.skipped == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stocks.json || true
          git add public/data/price_history.json || true
          git add public/data/price_history_missing.txt || true
          git add public/data/paradigm_scores.json || true
          git add public/data/paradigm_theme_metrics.json || true
          git add public/data/macro_state.json || true
          git add public/data/reverse_scores.json || true
          git add public/data/chain_manifest.json || true
          git add public/data/reverse_nomination_log.jsonl || true
          git add public/data/factor_scores.json || true
          git add public/data/factor_signal_log.jsonl || true
          git add public/data/valuation_models.json || true
          git add public/data/portfolio_plan.json || true
          git add public/data/portfolio_report.md || true
          git add public/data/paper_ledgers.json || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Auto-update: post-close price refresh + re-score"
          # The chain also touches files we deliberately don't commit (logs, csv
          # byproducts). They blocked `pull --rebase` on the first scheduled run
          # (2026-07-13: "cannot pull with rebase: You have unstaged changes",
          # 3/3 attempts, data never pushed). Drop them, then use the same
          # diverged-origin-resilient fetch+merge the data-fetch job uses.
          git checkout -- . || true
          pushed=false
          for i in 1 2 3; do
            git fetch origin main || true
            git merge -X ours --no-edit origin/main || git merge --abort 2>/dev/null || true
            if git push origin main; then
              pushed=true
              break
            fi
            echo "push attempt $i failed — retrying in 10s"
            sleep 10
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::push failed after 3 attempts"
            exit 1
          fi
