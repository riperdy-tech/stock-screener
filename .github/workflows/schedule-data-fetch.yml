name: Scheduled Data Fetch

on:
  schedule:
    # Runs at 00:00 UTC every 2 days
    - cron: '0 0 */2 * *'
  # Allows you to trigger it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests finance-datareader supabase python-dotenv
          
      - name: Run Data Fetchers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Add the scripts you want to run automatically here
          python scripts/fetch_data.py
          
      - name: Commit and Push Changes
        id: push_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add only the data files
          git add public/data/*.csv || true
          git add public/data/financials/*.json || true
          git add public/data/reports/*.json || true
          git add public/data/stocks.json || true
          git add public/data/scan.log || true
          
          # Commit if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update: Scheduled stock data refresh"
            
            # Pull latest changes and rebase to avoid push conflicts
            git pull --rebase origin main
            
            # Push to the current branch
            git push origin main
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
        outputs:
          changes: ${{ steps.push_changes.outputs.changes }}

      - name: Trigger Deployment
        if: steps.push_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deployment workflow..."
          gh workflow run deploy.yml --ref main
