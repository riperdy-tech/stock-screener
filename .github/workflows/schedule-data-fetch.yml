name: Scheduled Data Fetch

on:
  schedule:
    # Runs at 00:00 UTC every 2 days
    - cron: '0 0 */2 * *'
  # Allows you to trigger it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests finance-datareader
          
      - name: Run Data Fetchers
        run: |
          # Add the scripts you want to run automatically here
          # For example, to run the main fetcher:
          python scripts/fetch_data.py
          
          # To run international fetchers:
          # python scripts/fetch_data_intl.py
          
          # To compile international CSV:
          # python scripts/compile_intl_csv.py
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add only the data files
          git add public/data/*.csv || true
          git add public/data/financials/*.json || true
          git add public/data/reports/*.json || true
          git add public/data/stocks.json || true
          git add public/data/scan.log || true
          
          # Commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Scheduled stock data refresh"
          
          # Push to the current branch
          git push
