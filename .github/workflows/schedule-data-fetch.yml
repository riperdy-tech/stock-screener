name: Scheduled Data Fetch

on:
  # GitHub crons are the CLOUD BACKSTOP only (see the `preflight` job). The PRIMARY
  # run is dispatched by the home PC's scheduler:
  #     gh workflow run schedule-data-fetch.yml -R riperdy-tech/stock-screener -f runner=self-hosted
  # A self-hosted job is therefore only ever CREATED when the PC is actually online,
  # so it can never sit queued against an offline runner and block this backstop.
  schedule:
    # Backstop = the PC's target time + 120 min. Runs on ubuntu-latest, but the
    # preflight NO-OPs it (~1 billed min) if the PC already wrote a fresh ledger
    # within the last 120 min. Only a stale ledger (PC off, or its run failed)
    # lets the backstop actually fetch on the cloud.
    - cron: '35 16 * * 1-5'   # weekday backstop  (PC target 14:35 UTC + 120m)
    - cron: '35 12 * * 0,6'   # weekend backstop  (PC target 10:35 UTC + 120m)
  # Manual runs from the Actions tab; also the event the PC's self-dispatch uses.
  # Default ubuntu-latest = a human clicking "Run workflow" gets the cloud path;
  # the PC always passes an explicit `-f runner=self-hosted`.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner: ubuntu-latest bills GitHub minutes; self-hosted uses the home PC (must be online)"
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest

permissions:
  contents: write
  actions: write

# Serialize against the weekly analyst job — both regenerate + push the same
# public/data files; running concurrently caused rebase conflicts that silently
# dropped one run's output. Shared group across workflows queues them.
# SAFE NOW: nothing queues against an offline runner (primary is PC-dispatched),
# so a member of this group never blocks the others for hours.
concurrency:
  group: data-writers
  cancel-in-progress: false

jobs:
  # Cheap decision job (always ubuntu-latest, always available). Decides the
  # effective runner and whether the heavy jobs run at all. For a scheduled
  # (backstop) event it reads the ledger's freshness and SKIPS the fetch+score
  # when the PC path already delivered — so a normal day costs ~1 billed minute.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.d.outputs.run }}
      runner: ${{ steps.d.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual / PC self-dispatch: honor the chosen runner, always run.
            echo "runner=${{ inputs.runner }}" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled event == cloud backstop.
          echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          # Fail OPEN: if the ledger is missing/unreadable, treat as very stale so
          # the backstop fetches rather than silently skipping.
          age=$(python - <<'PY' || echo 999999
          import json, datetime
          ts = json.load(open('public/data/paper_ledgers.json'))['last_updated']
          dt = datetime.datetime.fromisoformat(ts.replace('Z', '+00:00'))
          print(int(round((datetime.datetime.now(datetime.timezone.utc) - dt).total_seconds() / 60)))
          PY
          )
          echo "ledger age: ${age} min (backstop threshold: 120)"
          if [ "$age" -gt 120 ]; then
            echo "STALE — PC path did not deliver a fresh ledger; backstop runs on cloud."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "FRESH — PC already delivered; backstop skips (no cloud minutes)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ${{ needs.preflight.outputs.runner }}
    timeout-minutes: 350          # fail loudly just under the 360 cap instead of a silent cancel

    defaults:
      run:
        shell: ${{ needs.preflight.outputs.runner == 'ubuntu-latest' && 'bash' || 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}' }}

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      # NOTE: with the primary now PC-dispatched, a scheduled run never targets
      # self-hosted, so this guard is effectively inert on the backstop path. Kept
      # as a backstop-of-the-backstop in case a self-hosted cron is ever re-added.
      - name: Reject a stale queued run
        if: github.event_name == 'schedule' && needs.preflight.outputs.runner != 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delay_min=$(python -c "
          import json, os, urllib.request, datetime
          url = '%s/repos/%s/actions/runs/%s' % (os.environ['GITHUB_API_URL'],
                os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID'])
          req = urllib.request.Request(url, headers={
                'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                'Accept': 'application/vnd.github+json'})
          ts = json.load(urllib.request.urlopen(req, timeout=30))['run_started_at']
          d = datetime.datetime.fromisoformat(ts.replace('Z', '+00:00'))
          print(int((datetime.datetime.now(datetime.timezone.utc) - d).total_seconds() // 60))
          ") || delay_min=""
          case "$delay_min" in
            ''|*[!0-9-]*)
              echo "::warning::could not determine queue delay (got '$delay_min') -- skipping staleness guard"
              exit 0 ;;
          esac
          echo "queue delay: ${delay_min} min"
          if [ "$delay_min" -gt 90 ]; then
            echo "::error::run started ${delay_min} min after it was scheduled (>90) — the self-hosted runner was probably offline. Refusing to fetch stale data."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python (GitHub-hosted)
        if: needs.preflight.outputs.runner == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Provision Python (self-hosted)
        if: needs.preflight.outputs.runner != 'ubuntu-latest'
        run: |
          VENV="$(cygpath -u "$RUNNER_TEMP")/venv"
          python -m venv "$VENV"
          cygpath -w "$VENV/Scripts" >> "$GITHUB_PATH"
          "$VENV/Scripts/python" --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance==1.5.1 pandas numpy requests finance-datareader supabase python-dotenv lxml html5lib beautifulsoup4 openai duckdb

      - name: Run Data Fetchers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/fetch_data.py
          python scripts/refresh_prices.py || echo "::warning::live price overlay skipped — stocks.json keeps the snapshot prices"

      - name: Commit and Push Fetched Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/*.csv || true
          git add public/data/financials/*.json || true
          git add public/data/reports/*.json || true
          git add public/data/stocks.json || true
          git add public/data/scan.log || true
          git add public/data/cik_map.json || true
          git add public/data/fundamentals_battery.json || true

          if git diff --quiet && git diff --staged --quiet; then
            echo "No fetched-data changes to commit"
          else
            git commit -m "Auto-update: Scheduled stock data refresh (fetch)"
            pushed=false
            for i in 1 2 3; do
              echo "Push attempt $i..."
              git fetch origin main || true
              git merge -X ours --no-edit origin/main || git merge --abort 2>/dev/null || true
              if git push origin main; then
                echo "Push succeeded"
                pushed=true
                break
              fi
              echo "Push attempt $i failed — re-syncing and retrying in 10s..."
              sleep 10
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Fetch push failed after 3 attempts — fetched data was NOT committed."
              exit 1
            fi
          fi

  score:
    needs: [preflight, fetch]
    if: needs.preflight.outputs.run == 'true'
    runs-on: ${{ needs.preflight.outputs.runner }}
    timeout-minutes: 350

    defaults:
      run:
        shell: ${{ needs.preflight.outputs.runner == 'ubuntu-latest' && 'bash' || 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}' }}

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout Repository (latest main, incl. fetch job's commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python (GitHub-hosted)
        if: needs.preflight.outputs.runner == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Provision Python (self-hosted)
        if: needs.preflight.outputs.runner != 'ubuntu-latest'
        run: |
          VENV="$(cygpath -u "$RUNNER_TEMP")/venv"
          python -m venv "$VENV"
          cygpath -w "$VENV/Scripts" >> "$GITHUB_PATH"
          "$VENV/Scripts/python" --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance==1.5.1 pandas numpy requests finance-datareader supabase python-dotenv lxml html5lib beautifulsoup4 openai duckdb

      - name: Run Scoring Chain (price history -> EPS -> reverse -> paradigm)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/build_price_history.py
          python scripts/fetch_eps_trajectory.py --apply --max-calls 500
          python scripts/fetch_dividends.py
          python scripts/run_chain.py

      - name: Commit and Push Changes
        id: push_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/paradigm_scores.json || true
          git add public/data/paradigm_theme_metrics.json || true
          git add public/data/price_history.json || true
          git add public/data/price_history_missing.txt || true
          git add public/data/eps_trajectory.json || true
          git add public/data/macro_state.json || true
          git add public/data/reverse_scores.json || true
          git add public/data/chain_manifest.json || true
          git add public/data/reverse_nomination_log.jsonl || true
          git add public/data/fundamentals_battery.json || true
          git add public/data/cik_map.json || true
          git add public/data/factor_scores.json || true
          git add public/data/factor_signal_log.jsonl || true
          git add public/data/valuation_models.json || true
          git add public/data/portfolio_plan.json || true
          git add public/data/portfolio_report.md || true
          git add public/data/paper_ledgers.json || true
          git add public/data/dividends.json || true
          git add public/data/paradigm_signal_log.jsonl || true
          git add public/data/paradigm_run_log.jsonl || true
          git add public/data/paradigm_history.json || true

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update: Scheduled stock data refresh"
            pushed=false
            for i in 1 2 3; do
              echo "Push attempt $i..."
              git fetch origin main || true
              git merge -X ours --no-edit origin/main || git merge --abort 2>/dev/null || true
              if git push origin main; then
                echo "Push succeeded"
                pushed=true
                break
              fi
              echo "Push attempt $i failed — re-syncing and retrying in 10s..."
              sleep 10
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Push failed after 3 attempts — run output was NOT committed."
              exit 1
            fi
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
