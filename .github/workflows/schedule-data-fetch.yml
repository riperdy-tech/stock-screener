name: Scheduled Data Fetch

on:
  schedule:
    # Runs at 09:30 UTC every 2 days (4 hours before NYSE open)
    - cron: '30 9 */2 * *'
  # Allows you to trigger it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests finance-datareader supabase python-dotenv
          
      - name: Run Data Fetchers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Add the scripts you want to run automatically here
          python scripts/fetch_data.py
          
      - name: Commit and Push Changes
        id: push_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add only the data files
          git add public/data/*.csv || true
          git add public/data/financials/*.json || true
          git add public/data/reports/*.json || true
          git add public/data/stocks.json || true
          git add public/data/scan.log || true
          
          # Commit if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update: Scheduled stock data refresh"
            
            # Pull latest and rebase — with retry & fallback strategy
            echo "Pulling latest from origin/main..."
            if ! git pull --rebase --autostash origin main; then
              echo "Rebase failed — trying merge strategy instead..."
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase origin main || true
            fi
            
            # Push with retry (handles transient network issues)
            for i in 1 2 3; do
              echo "Push attempt $i..."
              if git push origin main; then
                echo "Push succeeded"
                break
              fi
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            done
            
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
