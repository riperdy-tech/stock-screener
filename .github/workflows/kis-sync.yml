# KIS Portfolio Sync — mirrors a paper ledger into a KIS account.
#
# TRIGGER (2026-09-01): PRIMARY is the PC's Task Scheduler (RS2-KIS-Dispatch),
# which fires `gh workflow run kis-sync.yml -f as_scheduled=true` at 16:25 UTC —
# API dispatches arrive to the second. The weekday cron below is only a BACKSTOP
# for PC-off days: GitHub cron delivery drifted 4-9h on 2026-08-27..31, landing
# after the US close, so the market-hours gate skipped every run and the book
# went unsynced (2026-08-31 missed entirely). The "Backstop dedupe gate" makes
# the cron skip when a successful dispatch already ran today.
#
# as_scheduled=true makes a dispatch behave EXACTLY like the cron: env/execute/
# ledger/confirm-real all come from repo variables, both gates active, manual
# inputs ignored. The PC task therefore never carries credentials or the REAL
# MONEY confirm phrase.
#
# History: previously chained to Scheduled Data Fetch via workflow_run; decoupled
# 2026-08-25. The chain's guarantee (ledger just rewritten by a successful fetch)
# is replaced by the "Ledger freshness gate": it reads last_updated from
# paper_ledgers.json and refuses to trade on a stale book.
#
# 16:25 UTC is the median start time of the last 41 chained runs (16:31), so this
# reproduces the existing trading window. A market-hours gate skips post-close
# runs without failing them.
#
# Safety model:
#   - Scheduled runs are DRY RUN unless repo variable KIS_AUTO_EXECUTE=true.
#   - Env comes from repo variable KIS_ENV (default paper); secrets are split
#     into *_PAPER / *_REAL pairs so flipping the variable can never send
#     paper credentials at the real account or vice versa.
#   - Real trading additionally requires repo variable KIS_CONFIRM_REAL=true
#     (the script refuses --env real --execute without --confirm-real).
#   - Manual real runs require the env input + confirm phrase REAL MONEY.

name: KIS Portfolio Sync

on:
  schedule:
    - cron: '25 16 * * 1-5'
  workflow_dispatch:
    inputs:
      env:
        description: "Account (manual runs only; the schedule always uses the KIS_ENV variable)"
        type: choice
        options: [paper, real]
        default: paper
      confirm:
        description: "Type REAL MONEY to permit a real-account execute"
        default: ""
      execute:
        description: "Place orders (unchecked = dry run)"
        type: boolean
        default: false
      max_turnover:
        description: "Max turnover % of NAV (use 100 for first buy-in)"
        default: "40"
      ledger:
        description: "Ledger to mirror — LEAVE BLANK to use the KIS_LEDGER repo variable"
        default: ""
      probe:
        description: "Account diagnostics; places no orders"
        type: boolean
        default: false
      dd_resume:
        description: "Clear a drawdown HALT after review (peak kept; ladder governs re-entry)"
        type: boolean
        default: false
      dd_rebase:
        description: "DELIBERATE: restart the DD budget from current NAV (fresh 15% below here)"
        type: boolean
        default: false
      flow_usd:
        description: "OVERRIDE the automatic flow detector (rarely needed): USD moved in/out, or 0 to force none. Blank = auto-detect"
        default: ""
      probe_domestic_order:
        description: "With probe: also send ONE unfillable domestic order to test order permission"
        type: boolean
        default: false
      as_scheduled:
        description: "PC self-dispatch: behave exactly like the cron (repo vars govern env/execute/ledger; gates active; other inputs ignored)"
        type: boolean
        default: false

concurrency:
  group: kis-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # (The old `workflow_run.conclusion == 'success'` gate lived here. Its job —
    # never trade on a ledger a failed fetch left stale — is now done explicitly
    # by the "Ledger freshness gate" step, which does not care which workflow,
    # runner or schedule produced the ledger.)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      # BACKSTOP DEDUPE: the cron is the backstop behind the PC self-dispatch.
      # If any successful dispatch run of this workflow was created today since
      # 14:00 UTC, the cron skips instead of syncing twice. NOTE: a successful
      # manual run (e.g. a probe) also suppresses the backstop for the day —
      # acceptable, the sync is near-idempotent and this gate is belt-and-
      # suspenders. Fails OPEN (no skip) if the API call errors.
      - name: Backstop dedupe gate
        id: dedupe
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          N=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/kis-sync.yml/runs" \
                -f event=workflow_dispatch -f status=success -f created=">=${TODAY}T14:00:00Z" \
                --jq '.workflow_runs | length' 2>/dev/null || echo 0)
          echo "successful dispatch runs since ${TODAY}T14:00Z: ${N:-0}"
          if [ "${N:-0}" -gt 0 ] 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PC self-dispatch already synced today — backstop skips."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The cron is weekdays-only, but drift can still push a run past the close
      # (and a US market holiday is a weekday). Skip cleanly (green, no orders)
      # when the session is not open — script-level guards stay as backstop.
      - name: Market-hours gate
        id: gate
        if: (github.event_name == 'schedule' || inputs.as_scheduled) && steps.dedupe.outputs.skip != 'true'
        run: |
          OPEN=$(python -c "
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          ny = datetime.now(timezone.utc).astimezone(ZoneInfo('America/New_York'))
          print('true' if ny.weekday() < 5 and 9*60+30 <= ny.hour*60+ny.minute < 16*60 else 'false')")
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          echo "US market open: $OPEN"

      # Replaces the guarantee the workflow_run chain used to provide. On a
      # normal day the fetch (14:35 UTC) rewrites paper_ledgers.json about an hour
      # before this runs, so the book is <2h old. If the fetch failed, is still
      # running, or never started because the self-hosted runner was offline, the
      # newest last_updated is the previous post-close refresh (~19h old) and this
      # fails loudly instead of mirroring yesterday's book into the account.
      - name: Ledger freshness gate
        if: (github.event_name == 'schedule' || inputs.as_scheduled) && steps.dedupe.outputs.skip != 'true'
        run: |
          AGE_H=$(python -c "
          import json, datetime
          ts = json.load(open('public/data/paper_ledgers.json'))['last_updated']
          dt = datetime.datetime.fromisoformat(ts.replace('Z', '+00:00'))
          print(round((datetime.datetime.now(datetime.timezone.utc) - dt).total_seconds() / 3600, 1))")
          echo "paper_ledgers.json age: ${AGE_H}h"
          if [ "$(python -c "print(1 if float('$AGE_H') > 6 else 0)")" = "1" ]; then
            echo "::error::paper_ledgers.json is ${AGE_H}h old (>6h) — the data fetch did not produce a fresh ledger today. Refusing to trade on a stale book."
            exit 1
          fi

      # A manual run may target the real account via the env input; the schedule
      # never can (it only reads vars.KIS_ENV). Real + execute additionally needs
      # the exact confirm phrase, so a real buy-in cannot be a mis-click.
      - name: Guard real-money manual runs
        if: github.event_name == 'workflow_dispatch' && !inputs.as_scheduled && inputs.env == 'real' && inputs.execute
        run: |
          if [ "${{ inputs.confirm }}" != "REAL MONEY" ]; then
            echo "::error::real + execute requires confirm='REAL MONEY'"
            exit 1
          fi

      - name: Run sync
        if: (github.event_name != 'schedule' && !inputs.as_scheduled) || steps.gate.outputs.open == 'true'
        env:
          # Manual dispatch: the env input wins. Scheduled/as_scheduled: the repo variable.
          KIS_ENV: ${{ (github.event_name == 'workflow_dispatch' && !inputs.as_scheduled) && inputs.env || vars.KIS_ENV || 'paper' }}
          KIS_APP_KEY: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.as_scheduled) && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_APP_KEY_REAL || secrets.KIS_APP_KEY_PAPER }}
          KIS_APP_SECRET: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.as_scheduled) && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_APP_SECRET_REAL || secrets.KIS_APP_SECRET_PAPER }}
          KIS_CANO: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.as_scheduled) && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_CANO_REAL || secrets.KIS_CANO_PAPER }}
          KIS_ACNT_PRDT_CD: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.as_scheduled) && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_ACNT_PRDT_CD_REAL || secrets.KIS_ACNT_PRDT_CD_PAPER }}
          # No 'equal' fallback on purpose: the manual-dispatch input used to
          # default to "equal", which silently OVERRODE vars.KIS_LEDGER and would
          # have mirrored the wrong book on any manual run. The input now
          # defaults to blank so the repo variable wins; if that variable is also
          # missing this resolves to "" and ledger_weights() raises KeyError —
          # a loud failure with no orders, which is the correct outcome.
          KIS_LEDGER: ${{ (!inputs.as_scheduled && inputs.ledger) || vars.KIS_LEDGER }}
          KIS_PROBE_DOMESTIC_ORDER: ${{ inputs.probe_domestic_order == true && '1' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Trade-run notification (Telegram). Absent secrets = silent no-op.
          KIS_TG_BOT_TOKEN: ${{ secrets.KIS_TG_BOT_TOKEN }}
          KIS_TG_CHAT_ID: ${{ secrets.KIS_TG_CHAT_ID }}
          KIS_MSG_PREFIX: ${{ vars.KIS_MSG_PREFIX || '[KIS·trades]' }}
          # Phone-flippable halt: GitHub app -> repo Settings -> Variables -> KIS_HALT=true
          KIS_HALT: ${{ vars.KIS_HALT || '' }}
          # Emergency bypass for the drawdown governor (leave unset normally)
          KIS_DD_DISABLE: ${{ vars.KIS_DD_DISABLE || '' }}
        run: |
          FLAGS=""
          if [ "${{ inputs.probe }}" = "true" ]; then
            python scripts/sync_kis_portfolio.py --probe
            exit $?
          fi
          SCHED="${{ github.event_name == 'schedule' || inputs.as_scheduled == true }}"
          if [ "$SCHED" = "true" ]; then
            [ "${{ vars.KIS_AUTO_EXECUTE }}" = "true" ] && FLAGS="--execute"
          else
            [ "${{ inputs.execute }}" = "true" ] && FLAGS="--execute"
            [ "${{ inputs.dd_resume }}" = "true" ] && FLAGS="$FLAGS --dd-resume"
            [ "${{ inputs.dd_rebase }}" = "true" ] && FLAGS="$FLAGS --dd-rebase"
            # Dispatch-only, deliberately not a repo variable: a variable left
            # set would re-apply the same flow on every subsequent run.
            [ -n "${{ inputs.flow_usd }}" ] && FLAGS="$FLAGS --flow ${{ inputs.flow_usd }}"
          fi
          # --confirm-real for a scheduled/as_scheduled real run still gated by the
          # repo variable; for a manual real run the guard step enforced the phrase.
          if [ "$KIS_ENV" = "real" ]; then
            if [ "$SCHED" != "true" ] || [ "${{ vars.KIS_CONFIRM_REAL }}" = "true" ]; then
              FLAGS="$FLAGS --confirm-real"
            fi
          fi
          python scripts/sync_kis_portfolio.py \
            --max-turnover "${{ inputs.max_turnover || '40' }}" $FLAGS

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kis-sync-log-${{ github.run_id }}
          path: logs/kis_sync.jsonl
          if-no-files-found: ignore
          retention-days: 90
