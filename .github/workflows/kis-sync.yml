# KIS Portfolio Sync — mirrors the `equal` paper ledger into a KIS account.
#
# Safety model:
#   - Scheduled runs are DRY RUN unless repo variable KIS_AUTO_EXECUTE=true.
#   - Env comes from repo variable KIS_ENV (default paper); secrets are split
#     into *_PAPER / *_REAL pairs so flipping the variable can never send
#     paper credentials at the real account or vice versa.
#   - Real trading additionally requires repo variable KIS_CONFIRM_REAL=true
#     (the script refuses --env real --execute without --confirm-real).
#
# 14:40 UTC = 10:40 EDT / 09:40 EST — inside US regular session year-round,
# and after the 08:57 UTC ledger tracker refresh.

name: KIS Portfolio Sync

on:
  schedule:
    - cron: '40 14 * * 1-5'
  workflow_dispatch:
    inputs:
      env:
        description: "Account (manual runs only; the schedule always uses the KIS_ENV variable)"
        type: choice
        options: [paper, real]
        default: paper
      confirm:
        description: "Type REAL MONEY to permit a real-account execute"
        default: ""
      execute:
        description: "Place orders (unchecked = dry run)"
        type: boolean
        default: false
      max_turnover:
        description: "Max turnover % of NAV (use 100 for first buy-in)"
        default: "40"
      ledger:
        description: "Ledger to mirror (equal, equal_llm, ...)"
        default: "equal"
      probe:
        description: "Account diagnostics; places no orders"
        type: boolean
        default: false
      probe_domestic_order:
        description: "With probe: also send ONE unfillable domestic order to test order permission"
        type: boolean
        default: false

concurrency:
  group: kis-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      # A manual run may target the real account via the env input; the schedule
      # never can (it only reads vars.KIS_ENV). Real + execute additionally needs
      # the exact confirm phrase, so a real buy-in cannot be a mis-click.
      - name: Guard real-money manual runs
        if: github.event_name == 'workflow_dispatch' && inputs.env == 'real' && inputs.execute
        run: |
          if [ "${{ inputs.confirm }}" != "REAL MONEY" ]; then
            echo "::error::real + execute requires confirm='REAL MONEY'"
            exit 1
          fi

      - name: Run sync
        env:
          # Manual dispatch: the env input wins. Schedule: the repo variable.
          KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || vars.KIS_ENV || 'paper' }}
          KIS_APP_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_APP_KEY_REAL || secrets.KIS_APP_KEY_PAPER }}
          KIS_APP_SECRET: ${{ (github.event_name == 'workflow_dispatch' && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_APP_SECRET_REAL || secrets.KIS_APP_SECRET_PAPER }}
          KIS_CANO: ${{ (github.event_name == 'workflow_dispatch' && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_CANO_REAL || secrets.KIS_CANO_PAPER }}
          KIS_ACNT_PRDT_CD: ${{ (github.event_name == 'workflow_dispatch' && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_ACNT_PRDT_CD_REAL || secrets.KIS_ACNT_PRDT_CD_PAPER }}
          KIS_LEDGER: ${{ inputs.ledger || vars.KIS_LEDGER || 'equal' }}
          KIS_PROBE_DOMESTIC_ORDER: ${{ inputs.probe_domestic_order == true && '1' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          FLAGS=""
          if [ "${{ inputs.probe }}" = "true" ]; then
            python scripts/sync_kis_portfolio.py --probe
            exit $?
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            [ "${{ vars.KIS_AUTO_EXECUTE }}" = "true" ] && FLAGS="--execute"
          else
            [ "${{ inputs.execute }}" = "true" ] && FLAGS="--execute"
          fi
          # --confirm-real for a scheduled real run still gated by the repo variable;
          # for a manual real run the guard step above already enforced the phrase.
          if [ "$KIS_ENV" = "real" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ vars.KIS_CONFIRM_REAL }}" = "true" ]; then
              FLAGS="$FLAGS --confirm-real"
            fi
          fi
          python scripts/sync_kis_portfolio.py \
            --max-turnover "${{ inputs.max_turnover || '40' }}" $FLAGS

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kis-sync-log-${{ github.run_id }}
          path: logs/kis_sync.jsonl
          if-no-files-found: ignore
          retention-days: 90
