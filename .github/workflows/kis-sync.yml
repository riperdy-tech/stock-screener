# KIS Portfolio Sync — mirrors a paper ledger into a KIS account.
#
# TRIGGER: chained to Scheduled Data Fetch completion (workflow_run), not a cron.
# GitHub crons drift 0-3h, so clock-offset sequencing cannot guarantee the sync
# sees the freshly updated ledger; the chain can. The fetch runs just after the
# US open, so the sync trades mid-session minutes after the ledger updates.
# A market-hours gate skips the runs triggered by weekend fetches (and any fetch
# that finishes after the close) without failing them.
#
# Safety model:
#   - Chained runs are DRY RUN unless repo variable KIS_AUTO_EXECUTE=true.
#   - Env comes from repo variable KIS_ENV (default paper); secrets are split
#     into *_PAPER / *_REAL pairs so flipping the variable can never send
#     paper credentials at the real account or vice versa.
#   - Real trading additionally requires repo variable KIS_CONFIRM_REAL=true
#     (the script refuses --env real --execute without --confirm-real).
#   - Manual real runs require the env input + confirm phrase REAL MONEY.

name: KIS Portfolio Sync

on:
  workflow_run:
    workflows: ["Scheduled Data Fetch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      env:
        description: "Account (manual runs only; the schedule always uses the KIS_ENV variable)"
        type: choice
        options: [paper, real]
        default: paper
      confirm:
        description: "Type REAL MONEY to permit a real-account execute"
        default: ""
      execute:
        description: "Place orders (unchecked = dry run)"
        type: boolean
        default: false
      max_turnover:
        description: "Max turnover % of NAV (use 100 for first buy-in)"
        default: "40"
      ledger:
        description: "Ledger to mirror (equal, equal_llm, ...)"
        default: "equal"
      probe:
        description: "Account diagnostics; places no orders"
        type: boolean
        default: false
      probe_domestic_order:
        description: "With probe: also send ONE unfillable domestic order to test order permission"
        type: boolean
        default: false

concurrency:
  group: kis-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chained runs only proceed off a SUCCESSFUL fetch: a failed fetch means a
    # stale/inconsistent ledger, and the right response is to not trade on it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      # Chained runs fire after EVERY fetch, including weekend maintenance and
      # any fetch that drags past the close. Skip cleanly (green, no orders)
      # when the US session is over — script-level guards stay as backstop.
      - name: Market-hours gate
        id: gate
        if: github.event_name == 'workflow_run'
        run: |
          OPEN=$(python -c "
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          ny = datetime.now(timezone.utc).astimezone(ZoneInfo('America/New_York'))
          print('true' if ny.weekday() < 5 and 9*60+30 <= ny.hour*60+ny.minute < 16*60 else 'false')")
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          echo "US market open: $OPEN"

      # A manual run may target the real account via the env input; the schedule
      # never can (it only reads vars.KIS_ENV). Real + execute additionally needs
      # the exact confirm phrase, so a real buy-in cannot be a mis-click.
      - name: Guard real-money manual runs
        if: github.event_name == 'workflow_dispatch' && inputs.env == 'real' && inputs.execute
        run: |
          if [ "${{ inputs.confirm }}" != "REAL MONEY" ]; then
            echo "::error::real + execute requires confirm='REAL MONEY'"
            exit 1
          fi

      - name: Run sync
        if: github.event_name != 'workflow_run' || steps.gate.outputs.open == 'true'
        env:
          # Manual dispatch: the env input wins. Chained runs: the repo variable.
          KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || vars.KIS_ENV || 'paper' }}
          KIS_APP_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_APP_KEY_REAL || secrets.KIS_APP_KEY_PAPER }}
          KIS_APP_SECRET: ${{ (github.event_name == 'workflow_dispatch' && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_APP_SECRET_REAL || secrets.KIS_APP_SECRET_PAPER }}
          KIS_CANO: ${{ (github.event_name == 'workflow_dispatch' && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_CANO_REAL || secrets.KIS_CANO_PAPER }}
          KIS_ACNT_PRDT_CD: ${{ (github.event_name == 'workflow_dispatch' && inputs.env || vars.KIS_ENV) == 'real' && secrets.KIS_ACNT_PRDT_CD_REAL || secrets.KIS_ACNT_PRDT_CD_PAPER }}
          KIS_LEDGER: ${{ inputs.ledger || vars.KIS_LEDGER || 'equal' }}
          KIS_PROBE_DOMESTIC_ORDER: ${{ inputs.probe_domestic_order == true && '1' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          FLAGS=""
          if [ "${{ inputs.probe }}" = "true" ]; then
            python scripts/sync_kis_portfolio.py --probe
            exit $?
          fi
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            [ "${{ vars.KIS_AUTO_EXECUTE }}" = "true" ] && FLAGS="--execute"
          else
            [ "${{ inputs.execute }}" = "true" ] && FLAGS="--execute"
          fi
          # --confirm-real for a chained real run still gated by the repo variable;
          # for a manual real run the guard step above already enforced the phrase.
          if [ "$KIS_ENV" = "real" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ vars.KIS_CONFIRM_REAL }}" = "true" ]; then
              FLAGS="$FLAGS --confirm-real"
            fi
          fi
          python scripts/sync_kis_portfolio.py \
            --max-turnover "${{ inputs.max_turnover || '40' }}" $FLAGS

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kis-sync-log-${{ github.run_id }}
          path: logs/kis_sync.jsonl
          if-no-files-found: ignore
          retention-days: 90
