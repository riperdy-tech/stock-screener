# KIS Portfolio Sync — mirrors a paper ledger into a KIS account.
#
# TRIGGER (2026-09-01): PRIMARY is the PC's Task Scheduler (RS2-KIS-Dispatch),
# which fires `gh workflow run kis-sync.yml -f as_scheduled=true` at 16:25 UTC —
# API dispatches arrive to the second. The weekday cron below is only a BACKSTOP
# for PC-off days: GitHub cron delivery drifted 4-9h on 2026-08-27..31, landing
# after the US close, so the market-hours gate skipped every run and the book
# went unsynced (2026-08-31 missed entirely). The "Backstop dedupe gate" makes
# the cron skip when a successful dispatch already ran today.
#
# as_scheduled=true makes a dispatch behave EXACTLY like the cron: env/execute/
# ledger/confirm-real all come from repo variables, both gates active, manual
# inputs ignored. The PC task therefore never carries credentials or the REAL
# MONEY confirm phrase.
#
# History: previously chained to Scheduled Data Fetch via workflow_run; decoupled
# 2026-08-25. The chain's guarantee (ledger just rewritten by a successful fetch)
# is replaced by the "Ledger freshness gate": it reads last_updated from
# paper_ledgers.json and refuses to trade on a stale book.
#
# 16:25 UTC is the median start time of the last 41 chained runs (16:31), so this
# reproduces the existing trading window. A market-hours gate skips post-close
# runs without failing them.
#
# Safety model:
#   - Scheduled runs are DRY RUN unless repo variable KIS_AUTO_EXECUTE=true.
#   - Env comes from repo variable KIS_ENV (default paper); secrets are split
#     into *_PAPER / *_REAL pairs so flipping the variable can never send
#     paper credentials at the real account or vice versa.
#   - Real trading additionally requires repo variable KIS_CONFIRM_REAL=true
#     (the script refuses --env real --execute without --confirm-real).
#   - Manual real runs require the env input + confirm phrase REAL MONEY.

name: KIS Portfolio Sync

on:
  schedule:
    # BACKSTOP LADDER (2026-09-01): GitHub cron delivery drifts 0-9h, so one
    # entry cannot be trusted to land inside the US session on a PC-off day.
    # Several are scheduled; the gates decide which arrival actually trades:
    # dedupe skips once a sync succeeded today, the market-hours gate skips
    # out-of-session arrivals, the freshness gate refuses a stale book. On a
    # normal day (PC dispatched at 16:25) every arrival dedupe-skips in ~30s.
    - cron: '25 9 * * 1-5'
    - cron: '25 11 * * 1-5'
    - cron: '25 13 * * 1-5'
    - cron: '25 16 * * 1-5'
    - cron: '25 18 * * 1-5'
    - cron: '25 19 * * 1-5'   # last-chance rung: still pre-close in EDT (20:00) and EST (21:00)
  workflow_dispatch:
    inputs:
      env:
        description: "Account (manual runs only; the schedule always uses the KIS_ENV variable)"
        type: choice
        options: [paper, real]
        default: paper
      confirm:
        description: "Type REAL MONEY to permit a real-account execute"
        default: ""
      execute:
        description: "Place orders (unchecked = dry run)"
        type: boolean
        default: false
      max_turnover:
        description: "Max turnover % of NAV (use 100 for first buy-in)"
        default: "40"
      ledger:
        description: "Ledger to mirror — LEAVE BLANK to use the KIS_LEDGER repo variable"
        default: ""
      probe:
        description: "Account diagnostics; places no orders"
        type: boolean
        default: false
      dd_resume:
        description: "Clear a drawdown HALT after review (peak kept; ladder governs re-entry)"
        type: boolean
        default: false
      dd_rebase:
        description: "DELIBERATE: restart the DD budget from current NAV (fresh 15% below here)"
        type: boolean
        default: false
      flow_usd:
        description: "OVERRIDE the automatic flow detector (rarely needed): USD moved in/out, or 0 to force none. Blank = auto-detect"
        default: ""
      probe_domestic_order:
        description: "With probe: also send ONE unfillable domestic order to test order permission"
        type: boolean
        default: false
      as_scheduled:
        description: "PC self-dispatch: behave exactly like the cron (repo vars govern env/execute/ledger; gates active; other inputs ignored)"
        type: boolean
        default: false

# The dedupe gate reads run/job history via the API: it needs actions:read
# explicitly, else a restricted default token 403s and the gate fails open
# silently (every ladder rung would trade-check blind).
permissions:
  contents: read
  actions: read

concurrency:
  group: kis-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # (The old `workflow_run.conclusion == 'success'` gate lived here. Its job —
    # never trade on a ledger a failed fetch left stale — is now done explicitly
    # by the "Ledger freshness gate" step, which does not care which workflow,
    # runner or schedule produced the ledger.)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      # BACKSTOP DEDUPE: crons (the whole ladder) are backstops behind the PC
      # self-dispatch. Skip when ANY successful run today carries a successful
      # "Mark traded" step — i.e. a real sync execution (scheduled/as_scheduled,
      # or manual execute). Probes, manual dry-runs and gate-skipped green runs
      # never mark, so they can NOT suppress the day's real sync. Two near-
      # simultaneous arrivals cannot double-trade either: the kis-sync
      # concurrency group serializes runs, so the later one sees the earlier
      # one's marker. Fails OPEN (no skip) if the API calls error.
      - name: Backstop dedupe gate
        id: dedupe
        if: github.event_name == 'schedule' || inputs.as_scheduled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          SKIP=false
          # status=completed, NOT success: a run that traded and then failed a
          # later step (e.g. artifact upload) still counts as today's sync.
          IDS=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/kis-sync.yml/runs" \
                  -f status=completed -f created=">=${TODAY}T00:00:00Z" -f per_page=20 \
                  --jq '.workflow_runs[].id' 2>/dev/null) \
            || { echo "::warning::dedupe gate could not list today's runs — failing OPEN (may double-check trade)"; IDS=""; }
          for id in $IDS; do
            SYNCED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" \
                       --jq '[.jobs[].steps[] | select(.name == "Mark traded" and .conclusion == "success")] | length' \
                       2>/dev/null) \
              || { echo "::warning::dedupe gate could not read jobs of run ${id} — treating as not-traded"; SYNCED=0; }
            if [ "${SYNCED:-0}" -gt 0 ] 2>/dev/null; then
              echo "run ${id} already synced today — backstop skips."
              SKIP=true
              break
            fi
          done
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          [ "$SKIP" = "true" ] || echo "no marked sync yet today — backstop proceeds to gates."

      # The cron is weekdays-only, but drift can still push a run past the close
      # (and a US market holiday is a weekday). Skip cleanly (green, no orders)
      # when the session is not open — script-level guards stay as backstop.
      # Holiday-aware (2026-09-02): NYSE full-closure days are computed from
      # their rules (incl. Good Friday via Easter) — a holiday weekday must not
      # trade. Half-days are ignored on purpose: the sync window (12:25 ET)
      # ends before any 13:00 ET early close. Known benign edge: when Jan 1
      # falls on a Saturday NYSE observes nothing, but this marks the prior
      # Dec 31 as closed — it skips a sync day, never mis-trades.
      - name: Market-hours gate
        id: gate
        if: (github.event_name == 'schedule' || inputs.as_scheduled) && steps.dedupe.outputs.skip != 'true'
        run: |
          OPEN=$(python -c "
          from datetime import date, datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          def easter(y):
              a=y%19; b=y//100; c=y%100; d=b//4; e=b%4; f=(b+8)//25; g=(b-f+1)//3
              h=(19*a+b-d-g+15)%30; i=c//4; k=c%4; l=(32+2*e+2*i-h-k)%7
              m=(a+11*h+22*l)//451
              return date(y,(h+l-7*m+114)//31,((h+l-7*m+114)%31)+1)
          def nth(y,mo,wd,n):
              d=date(y,mo,1); d+=timedelta((wd-d.weekday())%7)
              return d+timedelta(weeks=n-1)
          def last_mon_may(y):
              d=date(y,5,31)
              return d-timedelta((d.weekday()-0)%7)
          def obs(d):
              if d.weekday()==5: return d-timedelta(1)
              if d.weekday()==6: return d+timedelta(1)
              return d
          def nyse_holidays(y):
              return {obs(date(y,1,1)), nth(y,1,0,3), nth(y,2,0,3),
                      easter(y)-timedelta(2), last_mon_may(y), obs(date(y,6,19)),
                      obs(date(y,7,4)), nth(y,9,0,1), nth(y,11,3,4),
                      obs(date(y,12,25))}
          ny = datetime.now(timezone.utc).astimezone(ZoneInfo('America/New_York'))
          open_ = (ny.weekday() < 5 and 9*60+30 <= ny.hour*60+ny.minute < 16*60
                   and ny.date() not in nyse_holidays(ny.year))
          print('true' if open_ else 'false')")
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          echo "US market open (holiday-aware): $OPEN"

      # Replaces the guarantee the workflow_run chain used to provide. On a
      # normal day the fetch (14:35 UTC) rewrites paper_ledgers.json about an hour
      # before this runs, so the book is <2h old. If the fetch failed, is still
      # running, or never started because the self-hosted runner was offline, the
      # newest last_updated is the previous post-close refresh (~19h old) and this
      # fails loudly instead of mirroring yesterday's book into the account.
      # Target-anchored, three-state (was: a 6h age window, which produced red
      # runs on early ladder arrivals and refused late-EST sessions):
      #   fresh          — ledger written since today's 14:20 UTC fetch target: trade.
      #   stale_pending  — no fresh data yet but it's not overdue (<17:30 UTC):
      #                    skip GREEN, a later ladder arrival trades once it lands.
      #   stale_overdue  — still no data after 17:30 UTC: fail RED. This is the
      #                    one loud alarm that means the data pipeline missed a day.
      # Gated on market-open so out-of-session arrivals never evaluate (no alarms
      # at 9:25 UTC about a ledger that isn't due until 14:35).
      - name: Ledger freshness gate
        id: fresh
        if: (github.event_name == 'schedule' || inputs.as_scheduled) && steps.dedupe.outputs.skip != 'true' && steps.gate.outputs.open == 'true'
        run: |
          STATE=$(python -c "
          import json, datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          ts = json.load(open('public/data/paper_ledgers.json'))['last_updated']
          dt = datetime.datetime.fromisoformat(ts.replace('Z', '+00:00'))
          tgt = now.replace(hour=14, minute=20, second=0, microsecond=0)
          overdue = now >= now.replace(hour=17, minute=30, second=0, microsecond=0)
          print('fresh' if dt >= tgt else ('stale_overdue' if overdue else 'stale_pending'))")
          echo "fresh=$STATE" >> "$GITHUB_OUTPUT"
          echo "ledger vs today's 14:20Z fetch target: $STATE"
          case "$STATE" in
            stale_overdue)
              echo "::error::no fresh ledger by 17:30 UTC — the data fetch missed today. Refusing to trade on a stale book."
              exit 1 ;;
            stale_pending)
              echo "data not yet due — skipping cleanly; a later ladder arrival trades once it lands." ;;
          esac

      # A manual run may target the real account via the env input; the schedule
      # never can (it only reads vars.KIS_ENV). Real + execute additionally needs
      # the exact confirm phrase, so a real buy-in cannot be a mis-click.
      - name: Guard real-money manual runs
        if: github.event_name == 'workflow_dispatch' && !inputs.as_scheduled && inputs.env == 'real' && inputs.execute
        env:
          # Via env, not ${{ }} inline: free-text inputs must never be pasted
          # into shell source (injection on a runner that holds live secrets).
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "REAL MONEY" ]; then
            echo "::error::real + execute requires confirm='REAL MONEY'"
            exit 1
          fi

      - name: Run sync
        id: runsync
        if: (github.event_name != 'schedule' && !inputs.as_scheduled) || (steps.gate.outputs.open == 'true' && steps.fresh.outputs.fresh == 'fresh')
        env:
          # Manual dispatch: the env input wins. Scheduled/as_scheduled: the repo variable.
          KIS_ENV: ${{ (github.event_name == 'workflow_dispatch' && !inputs.as_scheduled) && inputs.env || vars.KIS_ENV || 'paper' }}
          # BOTH credential pairs enter the step; the shell prologue below picks
          # by KIS_ENV and FAILS on any empty value. The old `A && REAL || PAPER`
          # expressions silently substituted the PAPER credential whenever a
          # *_REAL secret was unset — the opposite of the split's promise.
          K_REAL_APP_KEY: ${{ secrets.KIS_APP_KEY_REAL }}
          K_REAL_APP_SECRET: ${{ secrets.KIS_APP_SECRET_REAL }}
          K_REAL_CANO: ${{ secrets.KIS_CANO_REAL }}
          K_REAL_ACNT: ${{ secrets.KIS_ACNT_PRDT_CD_REAL }}
          K_PAPER_APP_KEY: ${{ secrets.KIS_APP_KEY_PAPER }}
          K_PAPER_APP_SECRET: ${{ secrets.KIS_APP_SECRET_PAPER }}
          K_PAPER_CANO: ${{ secrets.KIS_CANO_PAPER }}
          K_PAPER_ACNT: ${{ secrets.KIS_ACNT_PRDT_CD_PAPER }}
          # Free-text inputs via env only (injection surface — see guard step).
          FLOW_USD: ${{ inputs.flow_usd }}
          MAX_TURNOVER_IN: ${{ inputs.max_turnover }}
          # No 'equal' fallback on purpose: the manual-dispatch input used to
          # default to "equal", which silently OVERRODE vars.KIS_LEDGER and would
          # have mirrored the wrong book on any manual run. The input now
          # defaults to blank so the repo variable wins; if that variable is also
          # missing this resolves to "" and ledger_weights() raises KeyError —
          # a loud failure with no orders, which is the correct outcome.
          KIS_LEDGER: ${{ (!inputs.as_scheduled && inputs.ledger) || vars.KIS_LEDGER }}
          KIS_PROBE_DOMESTIC_ORDER: ${{ inputs.probe_domestic_order == true && '1' || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Trade-run notification (Telegram). Absent secrets = silent no-op.
          KIS_TG_BOT_TOKEN: ${{ secrets.KIS_TG_BOT_TOKEN }}
          KIS_TG_CHAT_ID: ${{ secrets.KIS_TG_CHAT_ID }}
          KIS_MSG_PREFIX: ${{ vars.KIS_MSG_PREFIX || '[KIS·trades]' }}
          # Phone-flippable halt: GitHub app -> repo Settings -> Variables -> KIS_HALT=true
          KIS_HALT: ${{ vars.KIS_HALT || '' }}
          # Emergency bypass for the drawdown governor (leave unset normally)
          KIS_DD_DISABLE: ${{ vars.KIS_DD_DISABLE || '' }}
        run: |
          # Credential selection: explicit, no cross-env fallback, loud on empty.
          if [ "$KIS_ENV" = "real" ]; then
            export KIS_APP_KEY="$K_REAL_APP_KEY" KIS_APP_SECRET="$K_REAL_APP_SECRET" \
                   KIS_CANO="$K_REAL_CANO" KIS_ACNT_PRDT_CD="$K_REAL_ACNT"
          else
            export KIS_APP_KEY="$K_PAPER_APP_KEY" KIS_APP_SECRET="$K_PAPER_APP_SECRET" \
                   KIS_CANO="$K_PAPER_CANO" KIS_ACNT_PRDT_CD="$K_PAPER_ACNT"
          fi
          for v in KIS_APP_KEY KIS_APP_SECRET KIS_CANO KIS_ACNT_PRDT_CD; do
            if [ -z "${!v}" ]; then
              echo "::error::${v} is empty for env=${KIS_ENV} — refusing to run (no cross-env credential fallback)."
              exit 1
            fi
          done
          FLAGS=""
          if [ "${{ inputs.probe }}" = "true" ]; then
            python scripts/sync_kis_portfolio.py --probe
            exit $?
          fi
          SCHED="${{ github.event_name == 'schedule' || inputs.as_scheduled }}"
          if [ "$SCHED" = "true" ]; then
            [ "${{ vars.KIS_AUTO_EXECUTE }}" = "true" ] && FLAGS="--execute"
          else
            [ "${{ inputs.execute }}" = "true" ] && FLAGS="--execute"
            [ "${{ inputs.dd_resume }}" = "true" ] && FLAGS="$FLAGS --dd-resume"
            [ "${{ inputs.dd_rebase }}" = "true" ] && FLAGS="$FLAGS --dd-rebase"
            # Dispatch-only, deliberately not a repo variable: a variable left
            # set would re-apply the same flow on every subsequent run.
            [ -n "$FLOW_USD" ] && FLAGS="$FLAGS --flow $FLOW_USD"
          fi
          # --confirm-real for a scheduled/as_scheduled real run still gated by the
          # repo variable; for a manual real run the guard step enforced the phrase.
          if [ "$KIS_ENV" = "real" ]; then
            if [ "$SCHED" != "true" ] || [ "${{ vars.KIS_CONFIRM_REAL }}" = "true" ]; then
              FLAGS="$FLAGS --confirm-real"
            fi
          fi
          # as_scheduled means "exactly like the cron": the turnover input is
          # ignored there, not just env/execute/ledger.
          TURNOVER="${MAX_TURNOVER_IN:-40}"
          [ "$SCHED" = "true" ] && TURNOVER="40"
          python scripts/sync_kis_portfolio.py \
            --max-turnover "$TURNOVER" $FLAGS

      # DEDUPE MARKER: read by the "Backstop dedupe gate" of later runs (and by
      # /api/admin/takeover). Fires only for a real sync execution — never for
      # probes, manual dry-runs, or runs whose sync step was gate-skipped — so
      # only actual trading suppresses the rest of the day's ladder.
      - name: Mark traded
        if: steps.runsync.outcome == 'success' && !inputs.probe && (github.event_name == 'schedule' || inputs.as_scheduled || inputs.execute)
        run: echo "traded — later ladder arrivals will dedupe-skip today"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kis-sync-log-${{ github.run_id }}
          path: logs/kis_sync.jsonl
          if-no-files-found: ignore
          retention-days: 90
