# Alerts if the RS2 overlay stops updating (dead PC, dead scheduler, dead push).
# Cloud-side on purpose: a dead machine cannot alert about itself. Silent no-op
# when the Telegram secrets are absent.
#
# 2026-08-25: the scheduled trigger moved into Post-Close Price Refresh (as a
# continue-on-error step) to cut scheduled-workflow minutes. This file stays as
# a manually dispatchable spot check; re-enable the cron below if the check
# ever needs to run independently of the price refresh.
name: Overlay Freshness Watchdog
on:
  # schedule:
  #   - cron: "30 10 * * 1-5"   # weekdays 10:30 UTC, after the local 00:00-UTC run window
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check overlay age and alert
        env:
          TG_TOKEN: ${{ secrets.KIS_TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.KIS_TG_CHAT_ID }}
        run: |
          AGE_H=$(python - <<'EOF'
          import json, datetime
          # depth_overlay.json stamps generated_at with datetime.now().isoformat() —
          # NAIVE local time, no 'Z'. Parse it naive and compare against a naive now()
          # (handoff §8). Do NOT use the old ts.replace("Z","+00:00") + now(tz=utc) path:
          # that mixes aware and naive datetimes and raises.
          ts = json.load(open("public/data/depth_overlay.json"))["generated_at"]
          dt = datetime.datetime.fromisoformat(ts)
          print(round((datetime.datetime.now() - dt).total_seconds() / 3600))
          EOF
          )
          echo "overlay age: ${AGE_H}h"
          if [ "$AGE_H" -gt 36 ]; then
            echo "::warning::depth_overlay.json is ${AGE_H}h old (>36h)"
            if [ -n "$TG_TOKEN" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT}" \
                -d text="[RS2 ops] depth_overlay.json is ${AGE_H}h old (>36h) — depth producer/PC/push may be down." >/dev/null
              echo "telegram alert sent"
            fi
          fi
