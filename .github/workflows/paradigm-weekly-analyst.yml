name: Paradigm Weekly Analyst Coverage

# Runs Sunday 10:00 UTC. Fetches yfinance analyst data + DeepSeek narrative
# summarization for all tagged stocks, then re-scores paradigm so the analyst
# uplift flows into pdm_economics_gate. Costs ~$0.07/run via DeepSeek.
on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Serialize against the daily Scheduled Data Fetch — both push the same
# public/data files. Sunday's daily run (09:30) and this weekly (10:00) used to
# overlap and conflict, silently dropping this run's analyst/GPR output.
concurrency:
  group: data-writers
  cancel-in-progress: false

jobs:
  weekly-analyst:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests python-dotenv openai finance-datareader lxml html5lib beautifulsoup4

      - name: Weekly SEC Refresh (quarterly-changing data; moved from daily)
        run: |
          # 1.4GB companyfacts download feeds quarterly-changing fields —
          # weekly cadence loses nothing vs daily.
          # (Intl KR/TW financials coverage removed 2026-08-21 — no longer used.)
          python scripts/fetch_sec_data.py
          python scripts/build_fundamentals_history.py || true

      - name: Fetch Analyst Coverage (Tier 1 yfinance + Tier 2 DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: |
          python scripts/fetch_analyst_coverage.py --apply --max-calls 500

      - name: Stage-4 Overlay (informed demand + GPR exposure)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: |
          # No `|| true`: soft DeepSeek failures already exit 0 (GPR tags carry
          # forward) and surface as ::warning::/::error:: annotations; a hard crash
          # (import/config error) should fail the step instead of hiding green.
          python scripts/fetch_overlay_signals.py --apply --max-calls 400

      - name: LLM Fallback Theme Classifier
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: |
          # Classifies stocks where rule-based composite missed. Pre-compute,
          # outputs sidecar consumed by score_paradigm.py.
          python scripts/classify_themes_llm.py --apply --max-calls 300

      - name: Re-score Chain (so analyst uplift flows into gate)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          # run_chain refreshes macro, re-runs reverse + paradigm in order,
          # and enforces coverage/freshness invariants.
          python scripts/run_chain.py

      - name: Backfill Signal Outcomes (forward returns vs IWM/SPY)
        run: |
          # Evaluates matured signal cohorts; free yfinance prices.
          python scripts/backfill_outcomes.py || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/analyst_coverage.json || true
          git add public/data/theme_assignments_llm.json || true
          git add public/data/overlay_signals.json || true
          git add public/data/*.csv || true
          git add public/data/financials/*.json || true
          git add public/data/fundamentals_battery.json || true
          git add public/data/fundamentals_history.json || true
          git add public/data/cik_map.json || true
          git add public/data/macro_state.json || true
          git add public/data/stocks.json || true
          git add public/data/paradigm_scores.json || true
          git add public/data/paradigm_theme_metrics.json || true
          git add public/data/reverse_scores.json || true
          git add public/data/chain_manifest.json || true
          git add public/data/factor_scores.json || true
          git add public/data/factor_signal_log.jsonl || true
          git add public/data/valuation_models.json || true
          git add public/data/reverse_nomination_log.jsonl || true
          git add public/data/outcome_backfill.json || true
          git add public/data/outcomes_report.md || true
          git add public/data/outcome_price_cache.json || true
          # run_chain also regenerates these — commit them (matches the daily job) so they are
          # NOT left dirty; an uncommitted change here makes the reconcile `git merge` refuse when
          # origin has touched the same file (the cause of the 2026-07 push failures).
          git add public/data/portfolio_plan.json || true
          git add public/data/portfolio_report.md || true
          git add public/data/paper_ledgers.json || true
          git add public/data/paradigm_history.json || true

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: Weekly analyst coverage refresh + paradigm re-score"

            # Resilient to a diverged origin: the daily job commits the same data
            # files, and the cross-workflow concurrency guard is NOT reliably
            # honored for delayed scheduled runs (they overlapped on 2026-06-28,
            # producing hundreds of merge conflicts in public/data/*). Re-sync each
            # attempt with `merge -X ours`: content conflicts keep THIS run's
            # freshly-regenerated files (it computed last, so it's the most current),
            # while non-conflicting origin changes (e.g. code commits) still merge in.
            pushed=false
            for i in 1 2 3; do
              git fetch origin main || true
              git merge -X ours --no-edit origin/main || git merge --abort 2>/dev/null || true
              if git push origin main; then
                echo "Push succeeded"
                pushed=true
                break
              fi
              echo "Push attempt $i failed — re-syncing and retrying in 10s..."
              sleep 10
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Push failed after 3 attempts — analyst/GPR output was NOT committed."
              exit 1
            fi
          fi
