name: Factor IC Monitor

# Monthly DIAGNOSTIC: re-fetch 10y monthly prices, re-run the point-in-time
# backtest (factor rank-ICs), and write the IC drift report. Weights are
# EQUAL by design (June 2026 ecosystem review) — this job never changes them;
# it keeps the evidence visible.
on:
  schedule:
    - cron: '0 11 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recalibrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests python-dotenv

      - name: Backtest + IC Drift Report (diagnostic only)
        run: |
          python scripts/backtest_lite.py --fetch-prices
          python scripts/backtest_lite.py
          python scripts/calibrate_factor_weights.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/backtest_results.json || true
          git add public/data/backtest_report.md || true
          git add public/data/factor_ic.json || true
          git add public/data/factor_ic_drift.md || true

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: Monthly factor IC drift report"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase origin main || true
            fi
            for i in 1 2 3; do
              if git push origin main; then
                echo "Push succeeded"
                break
              fi
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
            done
          fi
