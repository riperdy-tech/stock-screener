name: Update Mine Ledger

# On-demand refresh of the paper-trading ledgers (Track Record tab) WITHOUT the
# full daily data/scoring chain. Use after saving a My Portfolio snapshot on the
# site: it runs only track_paper_portfolios.py, which reads the snapshot from
# Supabase and marks it against the last-committed stocks.json prices. Seconds,
# not minutes. The daily Scheduled Data Fetch still refreshes with live prices.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never race the daily chain (or another manual run) writing the same ledger row.
  group: ledger-writers
  cancel-in-progress: false

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Update Paper Ledgers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        # Writes the ledger book straight to Supabase (table paper_ledgers); the
        # site reads it at runtime via /api/paper-ledgers. No commit, no redeploy.
        # (The local paper_ledgers.json it also writes is discarded with the runner.)
        run: python scripts/track_paper_portfolios.py
