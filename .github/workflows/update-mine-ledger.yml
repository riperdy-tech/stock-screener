name: Update Mine Ledger

# On-demand refresh of the paper-trading ledgers (Track Record tab) WITHOUT the
# full daily data/scoring chain. Use after saving a My Portfolio snapshot on the
# site: it runs only track_paper_portfolios.py, which reads the snapshot from
# Supabase and marks it against the last-committed stocks.json prices. Seconds,
# not minutes. The daily Scheduled Data Fetch still refreshes with live prices.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never race the daily chain (or another manual run) writing the same file.
  group: ledger-writers
  cancel-in-progress: false

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Update Paper Ledgers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/track_paper_portfolios.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/paper_ledgers.json || true
          if git diff --staged --quiet; then
            echo "No ledger changes to commit."
            exit 0
          fi
          git commit -m "Update paper ledgers (on-demand mine-ledger refresh)"
          # Land safely even if the daily chain pushed meanwhile.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Failed to push after retries." >&2
          exit 1
